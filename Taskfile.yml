version: '3'

# Import variable configurations
includes:
  vars: ./config/variables.yml

# Environment variables that can be overridden
env:
  SHELL_CONFIG: '{{default "bash" .SHELL_CONFIG}}'

tasks:
  check:
    desc: "Validate tracked shell shortcuts and setup tooling"
    cmds:
      - ./scripts/check-shell-shortcuts.zsh
      - ./scripts/test-repo-menu.zsh
      - bash scripts/test-setup-pi-config.sh
      - task: agent-tui:check
      - task: agent-comms:check
      - task: agent-relay:check

  default:
    desc: "Show available tasks and usage information"
    cmds:
      - task --list

  full-setup:
    desc: "Complete machine setup - installs all tools and configurations"
    interactive: true
    cmds:
      - task: pre-flight-check
      - task: git:setup
      - task: system:install-deps
      - task: tools:setup
      - task: python:setup-all
      - task: secrets:copy-to-home
      - task: shell:setup
      - task: pi:setup
      - task: ghostty:setup
      - task: theme-switcher:setup
      - task: post-setup-info

  quick-setup:
    desc: "Quick setup without heavy installations (assumes tools are installed)"
    interactive: true
    cmds:
      - task: git:setup
      - task: agent-tui:setup
      - task: shell:setup
      - task: pi:setup
      - task: ghostty:setup
      - task: theme-switcher:setup

  pre-flight-check:
    desc: "Check prerequisites before running setup"
    cmds:
      - cmd: |
          echo "🔍 Checking prerequisites..."
          
          # Check for GitHub CLI authentication
          if command -v gh &>/dev/null; then
            if gh auth status &>/dev/null; then
              echo "✅ GitHub CLI is authenticated"
            else
              echo "⚠️  GitHub CLI is installed but not authenticated"
              echo "  Run 'gh auth login' to authenticate with GitHub"
            fi
          else
            echo "ℹ️  GitHub CLI not installed yet (will be installed during setup)"
          fi
          
          # Check for optional environment variables
          if [ -z "$SECRETS_PASSWORD" ]; then
            echo "⚠️  Optional environment variable not set:"
            echo "  - SECRETS_PASSWORD (needed for secrets decryption)"
          fi

          echo "✅ Prerequisites check complete!"

  install-gh-cli:
    desc: "Install GitHub CLI"
    cmds:
      - bash scripts/install-gh.sh

  git:setup:
    desc: "Complete git setup - configuration, aliases, and GitHub CLI auth"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bash scripts/git-config.sh setup_config
      - bash scripts/git-config.sh setup_aliases
      - bash scripts/git-config.sh setup_ssh_key
      - bash scripts/git-config.sh setup_gh_auth

  # System dependencies
  system:install-deps:
    desc: "Install system dependencies"
    cmds:
      - cmd: |
          echo "📦 Installing system dependencies..."
          
          # Detect OS using uname (more reliable than $OSTYPE)
          OS="$(uname -s)"
          echo "🔍 Detected OS: $OS"
          
          if [ "$OS" = "Darwin" ]; then
            # macOS - Use Homebrew
            echo "🍎 Detected macOS, using Homebrew..."
            
            # Check if Homebrew is installed
            if ! command -v brew &> /dev/null; then
              echo "📦 Installing Homebrew..."
              /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            fi
            
            # Ensure Homebrew is in PATH (needed for Apple Silicon Macs or if not in current shell)
            if [ -f "/opt/homebrew/bin/brew" ]; then
              eval "$(/opt/homebrew/bin/brew shellenv)"
            elif [ -f "/usr/local/bin/brew" ]; then
              eval "$(/usr/local/bin/brew shellenv)"
            fi
            
            # Install packages via Homebrew
            brew install \
              unzip \
              tmux \
              sesh \
              zsh \
              ripgrep \
              vim \
              curl \
              wget \
              fzf
            
            # Install zsh-syntax-highlighting via Homebrew
            brew install zsh-syntax-highlighting || true
            
            # Install Xcode Command Line Tools (includes build tools)
            xcode-select --install 2>/dev/null || echo "Xcode Command Line Tools already installed"
            
            echo "✅ System dependencies installed via Homebrew"
          elif [ "$OS" = "Linux" ]; then
            # Linux - Use apt
            echo "🐧 Detected Linux, using apt..."

            # Use sudo only if not root and sudo is available
            SUDO=""
            if [ "$EUID" -ne 0 ]; then
              if command -v sudo >/dev/null 2>&1; then
                SUDO="sudo"
              fi
            fi

            $SUDO apt-get update -y && $SUDO apt upgrade -y

            # Base packages
            PKGS=(
              unzip
              tmux
              zsh
              zsh-syntax-highlighting
              ripgrep
              vim
              curl
              wget
              build-essential
              fzf
            )

            # Optional CUDA toolkit package (allow override via env)
            CUDA_PKG="${CUDA_TOOLKIT_PKG:-cuda-toolkit-12-6}"
            if [ -n "$CUDA_PKG" ]; then
              if apt-cache show "$CUDA_PKG" >/dev/null 2>&1; then
                PKGS+=("$CUDA_PKG")
              else
                echo "⚠️  $CUDA_PKG not found in apt sources; skipping CUDA install."
                echo "   To enable CUDA via apt, add the NVIDIA CUDA repo or set CUDA_TOOLKIT_PKG to an available package."
              fi
            fi

            $SUDO apt install -y "${PKGS[@]}"
            echo "✅ System dependencies installed via apt"
          else
            echo "❌ Unsupported OS: $OS"
            echo "   Supported OSes: Darwin (macOS), Linux"
            exit 1
          fi


  # Tool installation tasks
  tools:setup:
    desc: "Install all development tools in a single command"
    cmds:
      # - bash scripts/install-tools.sh install_gh_cli
      - bash scripts/install-tools.sh install_bun
      - bash scripts/install-tools.sh install_fnm_and_node
      - bash scripts/install-tools.sh install_rust
      - bash scripts/install-tools.sh install_loc
      - bash scripts/install-tools.sh install_ai_cli_tools
      - bash scripts/install-tools.sh install_jq
      - task: agent-tui:setup

  agent-tui:setup:
    desc: "Install the persistent agent TUI session manager"
    dir: tools/agent-tui
    cmds:
      - '"$HOME/.bun/bin/bun" install --frozen-lockfile'
      - '"$HOME/.bun/bin/bun" run install:config'
      - '"$HOME/.bun/bin/bun" run install:cli'

  agent-tui:check:
    desc: "Validate the persistent agent TUI session manager"
    dir: tools/agent-tui
    cmds:
      - '"$HOME/.bun/bin/bun" install --frozen-lockfile'
      - '"$HOME/.bun/bin/bun" run check'

  agent-comms:check:
    desc: "Validate the Slack agent communications daemon"
    dir: tools/agent-comms
    cmds:
      - '"$HOME/.bun/bin/bun" install --frozen-lockfile'
      - '"$HOME/.bun/bin/bun" run check'

  agent-relay:check:
    desc: "Validate the Mac Mini agent relay installer"
    dir: tools/agent-relay
    cmds:
      - '"$HOME/.bun/bin/bun" install --frozen-lockfile'
      - '"$HOME/.bun/bin/bun" run check'

  agent-relay:install:
    desc: "Install or upgrade the Mac Mini agent relay"
    dir: tools/agent-relay
    cmds:
      - '"$HOME/.bun/bin/bun" install --frozen-lockfile'
      - '"$HOME/.bun/bin/bun" run scripts/install.ts {{.CLI_ARGS}}'

  agent-relay:stage:
    desc: "Stage the relay bundle without loading launchd"
    cmds:
      - task -d "$HOME/Documents/core-repo" agents:stage -- relay {{.CLI_ARGS}}

  agent-relay:start:
    desc: "Start the staged relay LaunchAgent"
    cmds:
      - task -d "$HOME/Documents/core-repo" agents:start -- relay

  agent-relay:stop:
    desc: "Stop the relay LaunchAgent"
    cmds:
      - task -d "$HOME/Documents/core-repo" agents:stop -- relay

  agent-relay:status:
    desc: "Show the relay loopback health"
    cmds:
      - curl -fsS http://127.0.0.1:42200/health | jq

  agent-relay:logs:
    desc: "Tail relay stdout and stderr"
    cmds:
      - tail -F "$HOME/.claude/agent-relay/logs/relay.stdout.log" "$HOME/.claude/agent-relay/logs/relay.stderr.log"

  agent-comms:install:
    desc: "Install or upgrade the Mac Mini Slack agent daemon"
    dir: tools/agent-comms
    cmds:
      - '"$HOME/.bun/bin/bun" install --frozen-lockfile'
      - '"$HOME/.bun/bin/bun" run scripts/install.ts {{.CLI_ARGS}}'

  agent-comms:restart:
    desc: "Rebuild and restart the Mac Mini Slack agent daemon"
    cmds:
      - task: agent-comms:install

  agent-comms:stage:
    desc: "Build and stage the Slack daemon without restarting it"
    dir: tools/agent-comms
    cmds:
      - '"$HOME/.bun/bin/bun" install --frozen-lockfile'
      - '"$HOME/.bun/bin/bun" run scripts/install.ts --no-load'

  agent-comms:restart-after-reply:
    desc: "Validate and stage the Slack daemon, then restart after active replies finish"
    cmds:
      - task: agent-comms:check
      - task: agent-comms:stage
      - '"$HOME/.bun/bin/bun" run tools/agent-comms/src/cli/index.ts restart-after-reply'

  agent-comms:start:
    desc: "Start the installed Slack agent daemon"
    cmds:
      - launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.priori.agent-comms.plist 2>/dev/null || launchctl kickstart -k gui/$(id -u)/com.priori.agent-comms

  agent-comms:stop:
    desc: "Stop the installed Slack agent daemon"
    cmds:
      - launchctl bootout gui/$(id -u) ~/Library/LaunchAgents/com.priori.agent-comms.plist

  agent-comms:status:
    desc: "Show Slack agent daemon health"
    cmds:
      - 'curl -s http://127.0.0.1:42100/health | jq . || echo ''daemon not reachable on 127.0.0.1:42100'''

  agent-comms:logs:
    desc: "Tail Slack agent daemon logs"
    cmds:
      - tail -F ~/.claude/agent-comms/logs/stdout.log ~/.claude/agent-comms/logs/stderr.log

  machine:setup:
    desc: "Install machine identity and Claude SessionStart hook (--machine mbp|mac-mini)"
    cmds:
      - bun run scripts/setup-machine-identity.ts {{.CLI_ARGS}}

  agent-docs:setup:
    desc: "Install global agent instruction links from core-repo"
    cmds:
      - task -d "$HOME/Documents/core-repo" agents:link -- --global-only {{.CLI_ARGS}}

  coding-agents:update:
    desc: "Update Claude, Codex, and Gemini CLIs to their latest versions"
    cmds:
      - bash scripts/install-tools.sh update_ai_cli_tools

  # Python environment tasks
  python:setup-all:
    desc: "Setup complete Python environment with UV"
    cmds:
      - task: python:setup-uv

  python:setup-uv:
    desc: "Setup UV Python package manager"
    cmds:
      - cmd: |
          echo "🔧 Setting up UV environment..."
          
          # Install uv if not already installed
          if ! command -v uv &> /dev/null; then
            echo "📦 Installing uv..."
            curl -LsSf https://astral.sh/uv/install.sh | sh
            # uv installer adds to PATH, but ensure it's available for this session
            export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          else
            echo "✅ uv is already installed"
            uv --version
          fi
          
          # Ensure uv is in PATH for this session
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          
          # Install ruff via uv
          echo "📦 Installing ruff..."
          uv tool install ruff@latest
          
          echo "✅ UV environment setup successfully!"

  # Shell configuration tasks
  shell:setup:
    desc: "Complete shell setup - configures zsh, installs shortcuts, and sets zsh as default"
    cmds:
      - bash scripts/shell-config.sh setup_zsh_complete
      - bash scripts/shell-config.sh set_default_shell

  shell:aliases:
    desc: "Install tracked aliases and shell functions"
    cmds:
      - bash scripts/shell-config.sh install_shortcuts

  shell:copy-aliases:
    desc: "Compatibility task for shell:aliases"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - task: shell:aliases

  pi:setup:
    desc: "Install portable Pi keybindings/extensions and merge stable settings"
    cmds:
      - bash scripts/setup-pi-config.sh setup_pi_config

  ghostty:setup:
    desc: "Install and configure the isolated Ghostty profile (macOS)"
    cmds:
      - bash scripts/setup-ghostty.sh

  theme-switcher:setup:
    desc: "Install the macOS Appearance, CPU, and RAM menu-bar controls"
    cmds:
      - bash scripts/setup-hammerspoon.sh setup_all

  secrets:copy-to-home:
    desc: "Symlink secrets files from repository to home directory"
    cmds:
      - cmd: |          
          # Symlink .secrets if it exists (repo is source of truth)
          if [ -f ".secrets" ]; then
            REPO_SECRETS_CUSTOM="$(pwd)/.secrets"
            
            if [ -e "$HOME/.secrets" ]; then
              echo "ℹ️  ~/.secrets already exists; skipping symlink creation"
            else
              ln -s "$REPO_SECRETS_CUSTOM" "$HOME/.secrets"
              echo "✅ Created symlink: ~/.secrets -> $REPO_SECRETS_CUSTOM"
            fi
          fi
          
          echo ""
          echo "✅ Secrets files symlinked! Edit files in this repo and changes will be reflected automatically"
          echo "   Environment variables will be loaded automatically in new shell sessions"

  post-setup-info:
    desc: "Display post-setup information"
    silent: true
    cmds:
      - cmd: |
          echo ""
          echo "=== 🎉 Setup Complete! ==="
          echo ""
          echo "📦 Package Managers:"
          echo "  • Bun (JavaScript runtime & package manager)"
          echo "  • fnm with Node.js LTS and npm"
          echo "  • UV (Python package manager)"
          echo "  • Rust with Cargo"
          echo ""
          echo "🔧 Development Tools:"
          echo "  • Git (configured with aliases)"
          echo "  • vim, tmux, Sesh, ripgrep"
          echo "  • loc (lines of code counter)"
          echo "  • Ruff (Python linter)"
          echo "  • jq (JSON processor)"
          echo "  • zsh with oh-my-zsh"
          echo "  • Ghostty with an isolated fast Zsh profile (macOS)"
          echo "  • Menu-bar Light/Dark Appearance switcher (macOS)"
          echo ""
          echo "🤖 AI CLI Tools:"
          echo "  • Claude Code CLI"
          echo "  • OpenAI Codex CLI"
          echo ""
          echo "=== Quick Commands ==="
          echo ""
          echo "Use Node.js LTS: fnm use --lts"
          echo "Count lines of code: loc"
          echo "Process JSON: cat file.json | jq '.'"
          echo ""
          echo "Run 'task --list' to see all available tasks"

  clean:
    desc: "Clean up temporary files and caches"
    cmds:
      - cmd: |
          echo "🧹 Cleaning up temporary files..."
          rm -f .secrets  # Remove decrypted secrets
          apt-get autoremove -y
          apt-get clean
          echo "✅ Cleanup complete!"

  help:
    desc: "Show all available tasks"
    cmds:
      - task --list

  menu:
    desc: "Interactive task menu (prints the selected command; use tm to insert it at the prompt)"
    cmds:
      - ./task-menu.zsh
